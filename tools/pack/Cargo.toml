[package]
name = "notif-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dev and release tool: zip the notif release builds and write SHA256SUMS."

[[bin]]
name = "notif-pack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
